[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netreap"
version = "0.1.0"
description = "Enumeracao e post-exploitation de rede (SMB/LDAP) para pentest autorizado — alternativa enxuta ao CrackMapExec."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "grimh3xx" }]
keywords = ["pentest", "smb", "ldap", "active-directory", "crackmapexec", "ctf"]
dependencies = ["impacket>=0.11"]

[project.scripts]
netreap = "netreap.cli:main"

[tool.setuptools.packages.find]
include = ["netreap*"]
